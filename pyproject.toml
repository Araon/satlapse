[project]
name = "mosdac-video-generator"
version = "2.0.0"
description = "Scrape satellite images from MOSDAC (ISRO) and compile them into timelapse videos"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Araon" },
]
dependencies = [
    "opencv-python>=4.8.0",
    "requests>=2.28.0",
    "tqdm>=4.65.0",
]

[project.urls]
Homepage = "https://github.com/Araon/MOSDAC_Video_Generator"